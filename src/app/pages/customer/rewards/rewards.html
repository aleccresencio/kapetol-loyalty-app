<header class="page-header">
  <button class="link-button" (click)="goBack()">Back</button>
  <h1>Rewards</h1>
  <span></span>
</header>

<div class="rewards-container">

  <div class="points-summary">
    <span class="points-label">Your Points</span>
    <span class="badge">{{ totalPoints }}</span>
  </div>

  <ul class="reward-list">
    @for (reward of rewards; track reward.id) {
      <li class="reward-item">
        <div>
          <h2>{{ reward.name }}</h2>
          <p>{{ reward.description }}</p>
        </div>
        <div class="reward-end">
          <span class="badge" [class.badge-muted]="totalPoints < reward.pointsCost">
            {{ reward.pointsCost }} pts
          </span>
          <button
            class="btn btn-primary btn-small"
            [disabled]="totalPoints < reward.pointsCost"
            (click)="redeemReward(reward)">
            Redeem
          </button>
        </div>
      </li>
    }
  </ul>

</div>
