<ion-header>
  <ion-toolbar>
    <ion-title>Earn Points</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="logout()">Logout</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="scan-container">

    @if (scanning) {
      <div class="scanner-wrapper">
        <zxing-scanner [device]="selectedDevice" (camerasFound)="onCamerasFound($event)" (scanSuccess)="onScanSuccess($event)"></zxing-scanner>
        <ion-button expand="block" fill="outline" (click)="scanning = false">
          Cancel
        </ion-button>
      </div>
    } @else {
      <ion-item>
        <ion-label position="stacked">QR Code ID</ion-label>
        <ion-input [(ngModel)]="qrCodeId" placeholder="Scan or type QR code ID" readonly></ion-input>
      </ion-item>

      <ion-button expand="block" fill="outline" (click)="startScanning()" class="ion-margin-top">
        Scan QR Code
      </ion-button>

      <ion-item class="ion-margin-top">
        <ion-label position="stacked">Total Spent (₱)</ion-label>
        <ion-input [(ngModel)]="totalSpent" type="number" placeholder="e.g. 250"></ion-input>
      </ion-item>

      @if (error) {
        <ion-text color="danger">
          <p>{{ error }}</p>
        </ion-text>
      }

      @if (result) {
        <ion-card class="result-card">
          <ion-card-content>
            <h3>Points Added!</h3>
            <p>Customer: <strong>{{ result.name }}</strong></p>
            <p>Points Earned: <strong>{{ result.pointsEarned }}</strong></p>
            <p>Total Points: <strong>{{ result.totalPoints }}</strong></p>
          </ion-card-content>
        </ion-card>
      }

      <ion-button expand="block" (click)="submit()" class="ion-margin-top">
        Add Points
      </ion-button>

      <ion-button expand="block" fill="outline" (click)="goToRedeem()" class="ion-margin-top">
        Redeem a Reward
      </ion-button>
    }

  </div>

</ion-content>
