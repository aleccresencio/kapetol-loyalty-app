<div class="login-container">
  <div class="lock-icon">🔒</div>
  <h1>Staff access</h1>
  <p class="subtitle">Enter your 4-digit PIN</p>

  @if (error) {
    <p class="error-text">{{ error }}</p>
  }

  @if (submitting) {
    <div class="pin-status">
      <span class="spinner" aria-hidden="true"></span>
    </div>
  } @else {
    <div class="pin-indicators" [class.shake]="shake">
      @for (digit of digitIndicators; track $index) {
        <span class="pin-dot" [class.filled]="pin.length > $index"></span>
      }
    </div>
  }

  <div class="keypad">
    @for (key of keypad; track $index) {
      @if (key === 'back') {
        <button class="key key-back" (click)="pressKey(key)" aria-label="Backspace">⌫</button>
      } @else if (key === '') {
        <span class="key key-empty"></span>
      } @else {
        <button class="key" (click)="pressKey(key)">{{ key }}</button>
      }
    }
  </div>
</div>
