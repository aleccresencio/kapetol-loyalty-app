<ion-header>
  <ion-toolbar>
    <ion-title>Join Loyalty Program</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="register-container">

    <ion-item>
      <ion-label position="stacked">Full Name</ion-label>
      <ion-input [(ngModel)]="name" placeholder="Enter your name" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Phone Number</ion-label>
      <ion-input [(ngModel)]="phone" placeholder="e.g. 09123456789" type="tel"></ion-input>
    </ion-item>

    @if (error) {
      <ion-text color="danger">
        <p>{{ error }}</p>
      </ion-text>
    }

    <ion-button expand="block" (click)="register()" [disabled]="loading" class="ion-margin-top">
      Create Account
    </ion-button>

    <div class="divider">
      <span>Already have an account?</span>
    </div>

    <ion-button expand="block" fill="outline" (click)="login()" [disabled]="loading">
      Log In with Phone
    </ion-button>

  </div>

</ion-content>
