<ion-header>
  <ion-toolbar>
    <ion-title>My Dashboard</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="logout()">Logout</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="dashboard-container">

    <ion-card class="points-card">
      <ion-card-header>
        <ion-card-title>Hi, {{ customerName }}!</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div class="points-display">
          <span class="points-value">{{ totalPoints }}</span>
          <span class="points-label">points</span>
        </div>
      </ion-card-content>
    </ion-card>

    <ion-card class="qr-card">
      <ion-card-header>
        <ion-card-title>Your QR Code</ion-card-title>
      </ion-card-header>
      <ion-card-content class="qr-content">
        <img [src]="qrCodeUrl" alt="Your QR Code" class="qr-image" />
        <p class="qr-hint">Show this to the cafe staff to earn or redeem points.</p>
      </ion-card-content>
    </ion-card>

    <ion-button expand="block" (click)="goToRewards()">
      Browse Rewards
    </ion-button>

  </div>

</ion-content>
