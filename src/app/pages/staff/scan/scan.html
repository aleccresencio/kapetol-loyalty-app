<header class="page-header">
  <h1>Earn Points</h1>
  <button class="link-button" (click)="logout()">Logout</button>
</header>

<div class="scan-container">

  @if (scanning) {
    <div class="scanner-wrapper">
      <div [id]="readerElementId" class="scanner-video"></div>
      <button class="btn btn-outline" (click)="cancelScanning()">Cancel</button>
    </div>
  } @else {
    <label class="field">
      <span>QR Code ID</span>
      <input [(ngModel)]="qrCodeId" placeholder="Scan a QR code" readonly>
    </label>

    <button class="btn btn-outline" (click)="startScanning()">Scan QR Code</button>

    <label class="field">
      <span>Total Spent (₱)</span>
      <input [(ngModel)]="totalSpent" type="number" placeholder="e.g. 250">
    </label>

    @if (error) {
      <p class="error-text">{{ error }}</p>
    }

    @if (result) {
      <div class="result-card">
        <h3>Points Added!</h3>
        <p>Customer: <strong>{{ result.name }}</strong></p>
        <p>Points Earned: <strong>{{ result.pointsEarned }}</strong></p>
        <p>Total Points: <strong>{{ result.totalPoints }}</strong></p>
      </div>
    }

    <button class="btn btn-primary" (click)="submit()">Add Points</button>

    <button class="btn btn-outline" (click)="goToRedeem()">Redeem a Reward</button>

    <button class="btn btn-outline" (click)="goToHistory()">View History</button>
  }

</div>
