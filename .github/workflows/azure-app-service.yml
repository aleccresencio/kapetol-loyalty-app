name: Deploy API to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'KapetolLoyaltyApi/**'
      - '.github/workflows/azure-app-service.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy API

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish KapetolLoyaltyApi/KapetolLoyaltyApi.csproj -c Release -r linux-x64 --self-contained true -o publish_output

      - name: Zip artifact
        run: cd publish_output && zip -r ../publish_output.zip .

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: kapetol-api
          package: publish_output.zip
